[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-vllm-production"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
evaluation = [
    "torch==2.11.0",
    "transformers==5.17.0",
    "datasets==4.8.5",
    "vllm==0.26.0",
    "lm-eval[vllm]==0.4.13",
    "compressed-tensors==0.17.0",
]
serving = ["vllm==0.26.0", "compressed-tensors==0.17.0"]
benchmark = ["httpx>=0.27,<1", "transformers==5.17.0"]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
